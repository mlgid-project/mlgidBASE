GENERAL:
  DEBUG: True

MODEL:
  TYPE: 'faster_rcnn'
  REDOWNLOAD: False
  FORCE_CPU: False
#  ONNX_PATH: '/home/mymodel.onnx'

PREPROCESSING:
  CUDA: False                   #use CUDA for preprocessing if available
  FLIPHORIZONTAL: False         #flip the image horizontally for preprocessing
  QUAZIPOLAR: False             #use quazipolar transformation for preprocessing
  LOG: True                     #use log contrast correction for preprocessing
  HISTOGRAMEQUALIZATION: False  #use histogram equalization for preprocessing
  PERFORMCLIPPING: True         #perform clipping of pixel values for preprocessing
  HIGHERCLIPPINGPERCENTILE: 99.5 #upper clipping percentile for preprocessing
  LOWERCLIPPINGPERCENTILE: 5.0  #lower clipping percentile for preprocessing
  POLAR_SHAPE: [512,1024]       #model input size
  POLAR_CONVERSION: True        #use to perform polar conversion


POSTPROCESSING:
  SCORE: 0.4                    #minimum score for peaks
  NMSIOU: 0.4                   #non maximum suppression iou threshold
  TTA: False                    #use test time augmentation for postprocessing

INPUT:
  DATASET: '/home/testuser/mlgidDETECT/inputs/test.h5'  #pygid NeXus h5 file
  #IMGPATH: './inputs/w4_mapbbr32.tif'  #image file in reciprocal coordinates
  LABELED: False                #option to use labeled data for evaluation

OUTPUT:
  IMAGEPREFIX: 'w4_mapbbr32'    #image prefix for saving
  FOLDER: './outputs'           #image output folder